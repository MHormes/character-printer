services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-character_printer_app}
    env_file:
      - ${APP_ENV_FILE:-.env.development}
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-character_printer}:${POSTGRES_PASSWORD:-character_printer}@postgres:5432/${POSTGRES_DB:-character_printer}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-prod}
      S3_ENDPOINT: http://aistor:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-character-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-character-printer}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-character-printer-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      aistor:
        condition: service_started
    volumes:
      - ./database/data:/app/database/data:ro
      - ./database/storage:/app/database/storage:ro
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-character_printer_postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-character_printer}
      POSTGRES_USER: ${POSTGRES_USER:-character_printer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-character_printer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-character_printer} -d ${POSTGRES_DB:-character_printer}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  aistor:
    image: quay.io/minio/aistor/minio:latest
    container_name: ${AISTOR_CONTAINER_NAME:-character_printer_aistor}
    command: minio server /mnt/data --license /minio.license --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-character-printer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-character-printer-secret}
    ports:
      - "${AISTOR_API_PORT:-9000}:9000"
      - "${AISTOR_CONSOLE_PORT:-9001}:9001"
    volumes:
      - aistor_data:/mnt/data
      - ./minio.license:/minio.license
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ${TUNNEL_CONTAINER_NAME:-character_printer_tunnel}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-character_printer_postgres_data}
  aistor_data:
    name: ${AISTOR_VOLUME_NAME:-character_printer_aistor_data}
