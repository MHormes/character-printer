services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-character_printer_app}
    env_file:
      - ${APP_ENV_FILE:-.env.development}
    environment:
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-character_printer}:${POSTGRES_PASSWORD:-character_printer}@postgres:5432/${POSTGRES_DB:-character_printer}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-prod}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-character-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-character-printer}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-character-printer-secret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-character_printer_postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-character_printer}
      POSTGRES_USER: ${POSTGRES_USER:-character_printer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-character_printer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-character_printer} -d ${POSTGRES_DB:-character_printer}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ${MINIO_CONTAINER_NAME:-character_printer_minio}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-character-printer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-character-printer-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: ${MINIO_INIT_CONTAINER_NAME:-character_printer_minio_init}
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_BUCKET: ${S3_BUCKET:-character-images}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-character-printer}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-character-printer-secret}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\"; do
        sleep 1;
      done &&
      mc mb --ignore-existing local/\"$${S3_BUCKET}\" &&
      mc anonymous set none local/\"$${S3_BUCKET}\"
      "
    restart: "no"

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-character_printer_postgres_data}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-character_printer_minio_data}
